{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ site.name }}{% endblock %}

{% block content %}
<article class="post">
  <h1 class="page-title"><span aria-hidden="true">#</span> {{ page.title }}</h1>
  {% if page.pdf %}
  <p><a class="btn btn-ghost" href="{{ page.pdf }}" download>Download PDF</a></p>
  {% endif %}
  <div class="prose resume">{{ page.html|safe }}</div>
</article>
{% endblock %}
