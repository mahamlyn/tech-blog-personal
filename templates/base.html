<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ site.name }} - {{ site.tagline }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.tagline }}{% endblock %}">
  <meta name="theme-color" content="#0b0f14">
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
      } catch (e) {}
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = root.getAttribute('data-theme') === 'light' ? '#f6f8fb' : '#0b0f14';
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pygments.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-prompt" aria-hidden="true">&gt;</span>{{ site.name }}<span class="cursor" aria-hidden="true">_</span>
      </a>
      <div class="header-actions">
        <a class="icon-btn" href="{{ url_for('search') }}" aria-label="Search posts">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light and dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ url_for('blog_index') }}"{% if request.endpoint in ('blog_index', 'post', 'tag') %} aria-current="page"{% endif %}>Blog</a>
        <a href="{{ url_for('about') }}"{% if request.endpoint == 'about' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ url_for('resume') }}"{% if request.endpoint == 'resume' %} aria-current="page"{% endif %}>Resume</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ now.year }} {{ site.name }}</p>
      <p class="muted"><a href="{{ url_for('search') }}">search</a> &middot; <a href="{{ url_for('blog_index') }}">archive</a> &middot; <a href="{{ url_for('about') }}">about</a> &middot; <a href="{{ url_for('resume') }}">resume</a></p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
