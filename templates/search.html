{% extends "base.html" %}

{% block title %}Search - {{ site.name }}{% endblock %}

{% block content %}
<h1 class="page-title"><span aria-hidden="true">#</span> Search</h1>

<form class="search-form" role="search" action="{{ url_for('search') }}" method="get">
  <label class="sr-only" for="search-input">Search posts</label>
  <span class="prompt" aria-hidden="true">&gt;</span>
  <input id="search-input" name="q" type="search" placeholder="search posts, tags, code..." autocomplete="off" autofocus
         data-index="{{ url_for('search_index') }}">
</form>

<p id="search-status" class="muted" role="status" aria-live="polite"></p>
<ol id="search-results" class="results"></ol>
<noscript><p class="muted">Search needs JavaScript. Browse the <a href="{{ url_for('blog_index') }}">archive</a> instead.</p></noscript>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/search.js') }}" defer></script>
{% endblock %}
